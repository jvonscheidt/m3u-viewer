name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only jobs that write to the release opt in.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release gate, part 1: the tag must name the version in Cargo.toml.
  verify-tag:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      # "true" for SemVer prereleases such as v1.0.0-rc1.
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - name: Check tag against Cargo.toml version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/check-release-tag.sh "$TAG"

  # Release gate, part 2: the full CI suite against the tagged commit.
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Builds run read-only and pass their archives on as artifacts. The
  # compile step (and every build script in the dependency tree) never
  # holds a write token, and nothing is published until all targets build.
  build:
    name: build (${{ matrix.target }})
    needs: [verify-tag, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same pinned toolchain as CI, from rust-toolchain.toml.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="m3u-viewer-$TAG-$TARGET"
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/m3u-viewer.exe" "$name"/
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/$TARGET/release/m3u-viewer" "$name"/
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # One checksum file for all archives. To check a download, run
      # `sha256sum --check --ignore-missing SHA256SUMS`.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum m3u-viewer-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release for the tag
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            "${flags[@]}" || echo "release already exists"
      - name: Upload archives and checksums
        run: gh release upload "$TAG" dist/* --clobber

  publish-winget:
    name: publish to winget-pkgs
    needs: [verify-tag, release]
    # Prereleases (v1.0.0-rc1 and similar) stay on GitHub only; winget
    # users get stable versions.
    if: needs.verify-tag.outputs.prerelease == 'false'
    # winget-create is only supported on Windows
    runs-on: windows-latest
    # winget-create will read this environment variable to access the GitHub
    # token needed for submitting a PR. See https://aka.ms/winget-create-token
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
      # Pinned release of github.com/microsoft/winget-create. To bump, take
      # the new tag and the sha256 digest of its wingetcreate.exe asset
      # (gh release view <tag> -R microsoft/winget-create --json assets).
      WINGETCREATE_VERSION: v1.12.13.0
      WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
    steps:
      - name: Download and verify wingetcreate
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          curl.exe --fail --silent --show-error --location `
            --output wingetcreate.exe `
            "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe"
          $actual = (Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) {
            Write-Error "wingetcreate.exe SHA256 mismatch: expected $env:WINGETCREATE_SHA256, got $actual"
            exit 1
          }
          Write-Output "wingetcreate.exe $env:WINGETCREATE_VERSION verified ($actual)"
      - name: Submit package using wingetcreate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $packageId = "jvonscheidt.m3u-viewer"
          $packageVersion = $env:TAG.TrimStart("v")
          # Match the exact asset name, so SHA256SUMS or any other asset can
          # never be picked up as the installer.
          $assetName = "m3u-viewer-$env:TAG-x86_64-pc-windows-msvc.zip"

          $assets = (gh release view $env:TAG `
            --repo "${{ github.repository }}" `
            --json assets | ConvertFrom-Json).assets
          $asset = @($assets | Where-Object name -eq $assetName)
          if ($asset.Count -ne 1) {
            Write-Error "expected one asset named $assetName on release $env:TAG, found $($asset.Count)"
            exit 1
          }
          $installerUrl = $asset[0].url

          .\wingetcreate.exe update $packageId `
            --version $packageVersion `
            --urls "$installerUrl" `
            --submit
