# Dependabot version updates. PRs run the normal CI (fmt, clippy, test,
# cargo audit); nothing ships until a v* tag is pushed from main.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than a week: most compromised or broken releases
    # are pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # Groups match by name: Dependabot ignores dependency-type for cargo.
    # Keep both lists in sync with [dev-dependencies] in Cargo.toml.
    groups:
      # Dev-only crates: one PR, they never reach the binary.
      dev-dependencies:
        patterns:
          - criterion
      # Runtime minor/patch bumps together; majors get their own PRs.
      runtime:
        exclude-patterns:
          - criterion
        update-types:
          - minor
          - patch

  # rust-toolchain.toml pins the exact stable release. A bump can bring new
  # clippy lints, which CI (-D warnings) turns into errors, so a PR that
  # trips one stays blocked until the lints are fixed on its branch.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # trailing "# vX.Y.Z" comment together so the pins do not go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
